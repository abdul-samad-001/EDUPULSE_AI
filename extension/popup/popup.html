<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPulse AI Companion</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --primary: #2dd4bf;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --info: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.disconnected {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .active-website-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .domain-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-tag {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .category-productive { background: rgba(45, 212, 191, 0.2); color: var(--primary); }
    .category-distraction { background: rgba(244, 63, 94, 0.2); color: var(--danger); }
    .category-neutral { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      text-align: center;
    }

    .stat-box {
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 8px 4px;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 13px;
      font-weight: 800;
      margin-top: 2px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-primary { background: var(--primary); color: var(--bg-dark); }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary { background: rgba(51, 65, 85, 0.8); color: var(--text-main); border: 1px solid var(--border-dark); }
    .btn-secondary:hover { background: var(--border-dark); }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border-dark);
      transition: .3s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(14px); }

    .meta-footer {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px solid var(--border-dark);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <span style="font-size: 18px;">⚡</span>
      <span class="logo-text">EduPulse AI</span>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Connected</span>
    </div>
  </div>

  <!-- Active Domain Card -->
  <div class="card">
    <div class="card-title">Current Active Website</div>
    <div class="active-website-row">
      <span id="currentDomain" class="domain-name">Loading...</span>
      <span id="categoryBadge" class="category-tag category-productive">Productive</span>
    </div>
    <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
      Active Duration: <strong id="currentTimer" style="color: var(--text-main);">0s</strong>
    </div>
  </div>

  <!-- Session & Activity Metrics -->
  <div class="card">
    <div class="card-title">Today's Telemetry Summary</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Productive</div>
        <div id="productiveTime" class="stat-val" style="color: var(--primary);">0m</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Distraction</div>
        <div id="distractionTime" class="stat-val" style="color: var(--danger);">0m</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Queued</div>
        <div id="queuedSessions" class="stat-val" style="color: var(--info);">0</div>
      </div>
    </div>
  </div>

  <!-- Focus Session Status -->
  <div className="card" style="background: rgba(45, 212, 191, 0.08); border: 1px dashed var(--primary); padding: 10px; border-radius: 10px; margin-bottom: 12px; text-align: center;">
    <span id="focusStatus" style="font-size: 11px; font-weight: 700; color: var(--primary);">
      🎯 Focus Mode: Standard Browsing
    </span>
  </div>

  <!-- Quick Action Buttons -->
  <div class="actions-grid">
    <button id="btnDashboard" class="btn btn-primary">
      <span>📊</span> Dashboard
    </button>
    <button id="btnSync" class="btn btn-secondary">
      <span>🔄</span> Sync Now
    </button>
  </div>

  <!-- Settings Toggles -->
  <div class="card" style="margin-bottom: 10px;">
    <div class="card-title">Extension Settings</div>
    <div class="settings-row">
      <span>Enable Tracking</span>
      <label class="switch">
        <input type="checkbox" id="toggleTracking" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="settings-row">
      <span>Pause Tracking</span>
      <label class="switch">
        <input type="checkbox" id="togglePause" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Footer Metadata -->
  <div class="meta-footer">
    <span id="userInfo">Student Account</span>
    <span id="lastSyncInfo">Last Sync: Just now</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
